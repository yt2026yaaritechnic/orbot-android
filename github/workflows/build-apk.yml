name: Build APK

# يُشغَّل يدويًا من تبويب Actions، وأيضًا عند أي تعديل على الفرع الرئيسي
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # مهم: submodules ضروري لأن Orbot يعتمد على hev-socks5-tunnel
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # حسب README الرسمي، Orbot يستخدم حاليًا Java 25
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # الإصلاح: أوقفت جوجل خدمة الحزمة القديمة "tools" فصار sdkmanager يفشل عند طلبها.
      # نطلب platform-tools فقط، والإجراء يقبل التراخيص وGradle ينزّل الباقي (NDK وغيره).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleFullpermDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tor-vpn-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
